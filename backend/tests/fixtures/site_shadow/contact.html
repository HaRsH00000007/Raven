<!doctype html><html><body><h1>Contact</h1><contact-card></contact-card>
<script>
customElements.define('contact-card', class extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({mode: 'open'});
    r.innerHTML = `<form id="f"><label for="n">Full name</label><input id="n" name="name">
      <label for="e">Email</label><input id="e" type="email" name="email" required>
      <label for="m">Message</label><textarea id="m" name="message" required></textarea>
      <button type="submit">Send</button></form><p id="ok" hidden>Thank you, we received your message.</p>`;
    r.getElementById('f').addEventListener('submit', ev => { ev.preventDefault(); r.getElementById('f').style.display='none'; r.getElementById('ok').hidden=false; });
  }
});
</script></body></html>
